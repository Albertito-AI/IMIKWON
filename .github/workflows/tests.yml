name: Verify IMIKWON
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration checks (no API key)
        run: python -m unittest discover -s tests -v
      - name: Offline demonstration
        run: python -m imikwon demo
      - name: Install package and verify command
        run: |
          python -m pip install .
          imikwon --version
          imikwon doctor
